name: ReSharper Inspections
image: loremfoobar/resharper-inspections-bitbucket-pipe:1.1.0
description: Post ReSharper inspections to Bitbucket as a report with annotations
category: Code quality
repository: https://bitbucket.org/loremfoobar/resharper-inspections-bitbucket-pipe
maintainer:
  name: Amit E
  website: "https://github.com/loremfoobar"
tags:
  - code-insights
  - bitbucket-pipelines
  - resharper
  - jetbrains
  - dotnet
  - .net
variables:
  - name: INSPECTIONS_XML_PATH
  - name: ACCOUNT_EMAIL
  - name: API_TOKEN
  - name: CREATE_BUILD_STATUS
    default: "true"
  - name: INCLUDE_ONLY_ISSUES_IN_DIFF
    default: "false"
  - name: FAIL_WHEN_ISSUES_FOUND
    default: "false"
  - name: DEBUG
    default: "false"
